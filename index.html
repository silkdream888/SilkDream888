<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silk Dream | 雲感護理結算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9F8F6; }
        .serif { font-family: 'Playfair Display', serif; }
        .checkout-modal { transition: opacity 0.3s ease; }
        .product-checkbox:checked + label { border-color: #BC8F8F; background-color: #FFF9F9; }
    </style>
</head>
<body>

    <div class="flex justify-center items-center min-h-screen">
        <button onclick="openCheckout()" class="bg-black text-white px-10 py-4 uppercase text-xs font-bold tracking-widest">
            Confirm & Reserve / 確認下單
        </button>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl p-8 md:p-12 relative shadow-2xl rounded-sm">
            <button onclick="closeCheckout()" class="absolute top-6 right-6 text-gray-400 hover:text-black text-2xl">✕</button>
            
            <h2 class="text-3xl serif mb-2 text-center uppercase tracking-tighter">Order Details</h2>
            <p class="text-center text-gray-400 text-[10px] uppercase tracking-[0.2em] mb-10">請確認您的訂單詳情</p>
            
            <form id="orderForm" action="https://formspree.io/f/你的ID" method="POST" class="space-y-8">
                
                <div class="space-y-4">
                    <label class="text-[11px] font-bold uppercase text-gray-500 block border-b pb-2">Colour Selection / 款式選擇 (可多選)</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        
                        <div class="relative">
                            <input type="checkbox" id="color-champagne" name="選購產品" value="香檳金(Champagne Gold)" class="product-checkbox hidden" onchange="calculateTotal()">
                            <label for="color-champagne" class="block border border-gray-100 p-2 cursor-pointer hover:bg-gray-50 transition-all">
                                <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400" class="w-full aspect-square object-cover mb-2 grayscale-[0.5]">
                                <span class="text-[10px] font-bold block text-center uppercase">Champagne Gold</span>
                                <span class="text-[9px] text-gray-400 block text-center">HK$198</span>
                            </label>
                        </div>

                        <div class="relative">
                            <input type="checkbox" id="color-rose" name="選購產品" value="玫瑰粉(Rose Quartz)" class="product-checkbox hidden" onchange="calculateTotal()">
                            <label for="color-rose" class="block border border-gray-100 p-2 cursor-pointer hover:bg-gray-50 transition-all">
                                <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400" class="w-full aspect-square object-cover mb-2 grayscale-[0.5]">
                                <span class="text-[10px] font-bold block text-center uppercase">Rose Quartz</span>
                                <span class="text-[9px] text-gray-400 block text-center">HK$198</span>
                            </label>
                        </div>

                        <div class="relative">
                            <input type="checkbox" id="color-black" name="選購產品" value="午夜黑(Midnight Black)" class="product-checkbox hidden" onchange="calculateTotal()">
                            <label for="color-black" class="block border border-gray-100 p-2 cursor-pointer hover:bg-gray-50 transition-all">
                                <img src="https://images.unsplash.com/photo-1582562124811-c8026933ca8b?w=400" class="w-full aspect-square object-cover mb-2 grayscale-[0.5]">
                                <span class="text-[10px] font-bold block text-center uppercase">Midnight Black</span>
                                <span class="text-[9px] text-gray-400 block text-center">HK$198</span>
                            </label>
                        </div>

                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase text-gray-500">Full Name / 姓名</label>
                        <input type="text" name="客戶姓名" placeholder="請輸入收貨人全名" required class="w-full border-b border-gray-200 py-3 text-sm focus:border-black outline-none transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase text-gray-500">WhatsApp / 聯絡電話</label>
                        <input type="tel" name="聯絡電話" placeholder="例如：+852 6123 4567" required class="w-full border-b border-gray-200 py-3 text-sm focus:border-black outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[11px] font-bold uppercase text-gray-500">Shipping Address / 收貨地址</label>
                    <textarea name="收貨地址" rows="2" placeholder="填寫收貨地址或順豐智能櫃編號" class="w-full border-b border-gray-200 py-3 text-sm focus:border-black outline-none transition-all bg-transparent"></textarea>
                </div>

                <div class="bg-[#FFF9F1] p-6 text-center space-y-2">
                    <p class="text-[11px] text-[#D4A373] font-bold">✨ 下單提醒：</p>
                    <p class="text-[10px] text-gray-500 leading-relaxed">成功提交訂單後，我們的專員將會在 2 個工作天內<br>透過 WhatsApp 與您聯絡確認細節及安排付款。</p>
                </div>

                <input type="hidden" name="總金額" id="form-total-price">
                <input type="hidden" name="聯絡沒有" value="未處理">
                <input type="hidden" name="發貨沒有" value="未處理">
                <input type="hidden" name="支付沒有" value="未處理">

                <button type="submit" class="w-full bg-black text-white py-6 text-xs font-bold uppercase tracking-[0.3em] hover:bg-[#BC8F8F] transition-all">
                    Confirm & Reserve / 確認下單 <span id="display-total"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        function openCheckout() {
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function calculateTotal() {
            const checkboxes = document.querySelectorAll('.product-checkbox:checked');
            const total = checkboxes.length * 198; // 假設單價為 198 
            const display = document.getElementById('display-total');
            const hiddenInput = document.getElementById('form-total-price');
            
            if (total > 0) {
                display.innerText = `(HK$${total})`;
                hiddenInput.value = `HK$${total}`;
            } else {
                display.innerText = '';
                hiddenInput.value = '';
            }
        }
    </script>
</body>
</html>
