<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款成功 | SilkDream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9F8F6; }
        .serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <div class="max-w-2xl w-full bg-white p-12 text-center border border-gray-200 shadow-xl rounded-lg">
        <div class="w-24 h-24 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-8 text-5xl font-bold">✓</div>
        <h1 class="text-5xl serif font-bold mb-4">付款成功!</h1>
        <p class="text-gray-500 text-sm tracking-widest uppercase mb-8 font-bold" id="order-id">Order Ref: Loading...</p>
        <div class="bg-gray-50 p-8 mb-8 border border-dashed border-gray-300 rounded">
            <p class="text-lg text-black mb-4 font-semibold">感謝您的訂購!</p>
            <p class="text-sm text-gray-600 leading-relaxed">
                確認郵件已發送至您的電郵地址。<br>
                我們將於 2-3 個工作天內透過順豐發貨。
            </p>
        </div>
        <div class="space-y-4">
            <a href="https://silkdream888.github.io/SilkDream888/" class="block w-full bg-black text-white py-4 tracking-widest text-sm font-bold uppercase hover:bg-gray-800 transition-all rounded">返回主頁</a>
            <a href="https://wa.me/85298560191?text=訂單編號:" id="whatsapp-link" class="block w-full bg-green-500 text-white py-4 tracking-widest text-sm font-bold uppercase hover:bg-green-600 transition-all rounded">聯絡客服 WhatsApp</a>
            <a href="https://silkdream888.github.io/SilkDream888/#shop" class="block w-full bg-white border-2 border-black text-black py-4 tracking-widest text-sm font-bold uppercase hover:bg-gray-50 transition-all rounded">繼續購物</a>
        </div>
        
        <div class="mt-12 pt-8 border-t border-gray-200">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-4 font-bold">小貼士</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left text-sm text-gray-600">
                <div class="bg-gray-50 p-4 rounded">
                    <p class="font-bold mb-2">💧 清洗方法</p>
                    <p class="text-xs">冷水手洗，使用中性洗滌劑，切勿曝曬</p>
                </div>
                <div class="bg-gray-50 p-4 rounded">
                    <p class="font-bold mb-2">🌙 使用建議</p>
                    <p class="text-xs">每週清洗1-2次，保持蠶絲活性</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        if (orderId) {
            document.getElementById('order-id').innerText = `Order Ref: ${orderId}`;
            document.getElementById('whatsapp-link').href = `https://wa.me/85298560191?text=訂單編號: ${orderId}`;
        }
    </script>
</body>
</html>
